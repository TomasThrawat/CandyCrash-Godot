name: Godot Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v5
      - name: Install fontconfig for headless font support
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig
          fc-cache -f
      - name: Install Android export dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk unzip ca-certificates curl
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          curl --version
      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk" ]; then
            curl -fL --retry 4 --retry-delay 2 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/godot-export-templates.tpz
            unzip -q /tmp/godot-export-templates.tpz -d /tmp/godot-export-templates
            cp -a /tmp/godot-export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          fi
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
      - name: Configure Godot Android SDK and Java SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
          cat "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Run headless smoke test
        run: godot --headless --path . --quit-after 3 > smoke.log 2>&1
      - name: Verify Android export environment
        run: |
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"
          test -x "/usr/lib/jvm/java-17-openjdk-amd64/bin/java"
          test -x "/usr/lib/android-sdk/platform-tools/adb"
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/CandyCrash.apk
          test -s build/CandyCrash.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: candy-crash-android
          path: build/CandyCrash.apk
          if-no-files-found: error
      - name: Scan for parser/runtime errors
        run: |
          godot --headless --path . --editor --quit > godot-check.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|WARNING:|deprecated" godot-check.log; then
            cat godot-check.log
            exit 1
          fi
